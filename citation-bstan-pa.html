:root{--gold:#C9A227}
html,body{margin:0;padding:0;background:#0d0a07;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0a07}
#root{position:relative;width:1920px;height:1080px;transform-origin:center center;
	font-family:'Inter',system-ui,sans-serif;color:#f3e7d2;overflow:hidden;
	background:radial-gradient(120% 100% at 50% 22%,#241a12 0%,#171009 55%,#0d0a07 100%)}
.tib{font-family:'Noto Serif Tibetan',serif;font-feature-settings:"kern" 1}
.fr{font-family:'EB Garamond',Georgia,serif}

/* ---------- fond ---------- */
#bg{position:absolute;inset:0;pointer-events:none}
#lotus{position:absolute;left:50%;top:54%;width:1680px;height:1680px;margin:-840px 0 0 -840px;opacity:0}
#vign{position:absolute;inset:0;background:radial-gradient(75% 62% at 50% 46%,rgba(0,0,0,0) 40%,rgba(0,0,0,.62) 100%)}

/* ---------- drapeaux ---------- */
#flags{position:absolute;left:0;top:0;width:1920px;height:150px;opacity:0}

/* ---------- carte pecha ---------- */
#card{position:absolute;left:180px;top:196px;width:1560px;height:718px;
	transform-origin:50% 0%;opacity:0;
	background:linear-gradient(168deg,#f6ead1 0%,#efdfc0 48%,#e6d2ae 100%);
	border-radius:5px;
	box-shadow:0 30px 70px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.25) inset}
#card .edge{position:absolute;inset:14px;border:2px solid #9c2b25;border-radius:3px}
#card .edge2{position:absolute;inset:22px;border:1px solid rgba(156,43,37,.42);border-radius:2px}
#card .rail{position:absolute;top:22px;bottom:22px;width:26px;background:
	repeating-linear-gradient(180deg,rgba(156,43,37,.85) 0 16px,rgba(156,43,37,.25) 16px 24px)}
#card .rail.l{left:34px}#card .rail.r{right:34px}
#card .fret{position:absolute;left:78px;right:78px;height:16px;opacity:.5}
#card .fret.t{top:32px}#card .fret.b{bottom:22px}
#yig{position:absolute;left:0;right:0;top:52px;text-align:center;font-size:34px;color:#9c2b25;opacity:0}

/* ---------- grille métrique ---------- */
#grid{position:absolute;left:110px;top:118px;width:1340px}
.gridhead{position:relative;height:34px}
.colnum{position:absolute;top:0;width:0;text-align:center;font-size:15px;letter-spacing:.16em;
	color:#8a6a3c;opacity:0;transform:translateY(-6px)}
.caes{position:absolute;top:26px;width:2px;border-radius:2px;background:linear-gradient(180deg,rgba(138,106,60,0) 0%,rgba(138,106,60,.78) 14%,rgba(138,106,60,.78) 86%,rgba(138,106,60,0) 100%);
	height:0;overflow:hidden}
.vline{position:relative;height:104px}
.cell{position:absolute;top:0;text-align:center;font-size:54px;line-height:104px;color:#2a1d10;
	opacity:0;transform:translateY(10px) scale(.94);white-space:nowrap}
.cell .p{transition:none}
.shad{position:absolute;top:0;font-size:46px;line-height:104px;color:#9c2b25;opacity:0}
#meter{position:absolute;left:110px;width:1340px;top:560px;text-align:center;opacity:0}
#meter .mb{display:inline-block;font-size:16px;letter-spacing:.1em;color:#7a5c33}
#meter .mt{display:block;margin-top:7px;font-size:17px;color:#5d4425}
#legend{position:absolute;left:110px;width:1340px;top:616px;text-align:center;opacity:0;
	display:flex;flex-wrap:wrap;justify-content:center;gap:9px 16px}
.chip{opacity:0;transform:translateY(6px);font-size:15px;padding:4px 12px;border-radius:20px;
	border:1px solid currentColor;white-space:nowrap}
.chip b{font-weight:600}

/* ---------- panneau bas ---------- */
#panel{position:absolute;left:112px;top:500px;width:1696px;height:560px}
.scene{position:absolute;inset:0;opacity:0}

/* lexique */
#lex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 30px;align-content:start}
.lx{opacity:0;transform:translateY(8px);display:flex;align-items:baseline;gap:11px;
	border-bottom:1px solid rgba(243,231,210,.10);padding-bottom:5px}
.lx .t{font-size:25px;min-width:168px;max-width:168px;white-space:nowrap;color:#f0e2c8;line-height:1.35}
.lx .g{font-size:14px;color:#b9a37e;font-style:italic}
.lx .n{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:#9a8462;margin-bottom:1px}
.lx .f{font-size:17px;line-height:1.45;color:#e4d6bd;font-family:'EB Garamond',Georgia,serif}

/* grammaire */
#gram{display:grid;grid-template-columns:1fr 1fr;gap:26px 44px;align-content:center;height:100%}
.gc{opacity:0;transform:translateY(10px);border-left:3px solid;padding:10px 0 10px 20px}
.gc h3{margin:0 0 8px;font-size:21px;font-weight:600;letter-spacing:.01em}
.gc p{margin:0;font-size:19px;line-height:1.72;color:#ddcfb6;font-family:'EB Garamond',Georgia,serif}
.tb{font-family:'Noto Serif Tibetan',serif;font-size:1.06em;line-height:1}

/* traductions */
#trad{text-align:center}
#wy{opacity:0;font-size:20px;color:#c0ad8d;letter-spacing:.02em;line-height:1.65}
#wy .ph{display:block;margin-top:5px;color:#9f8f75;font-size:18px}
#lit{margin-top:20px;font-size:26px;line-height:1.6;color:#f1e5cd;font-family:'EB Garamond',Georgia,serif}
#lit span{opacity:0;display:block}
#ret{margin-top:20px;font-size:30px;line-height:1.62;color:#f7d98a;font-family:'EB Garamond',Georgia,serif}
#ret span{opacity:0;display:block}
#sens{margin-top:16px;opacity:0;font-size:18px;color:#b9a37e}

#seal{position:absolute;right:96px;bottom:64px;width:74px;height:74px;border-radius:50%;
	border:1.5px solid rgba(247,217,138,.55);color:#f7d98a;font-size:34px;
	display:flex;align-items:center;justify-content:center;opacity:0}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* ---------- contrôles ---------- */
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 22px;display:flex;align-items:center;gap:16px;
	background:linear-gradient(transparent,rgba(0,0,0,.72));z-index:10;font-family:'Inter',sans-serif}
#ui button{background:rgba(201,162,39,.16);color:#E4D5A8;border:1px solid rgba(201,162,39,.45);
	border-radius:999px;padding:8px 20px;font:inherit;font-size:14px;letter-spacing:.05em;cursor:pointer}
#ui button:hover{background:rgba(201,162,39,.3)}
#ui button:focus-visible,#bar:focus-visible{outline:2px solid #E4D5A8;outline-offset:3px}
#bar{flex:1;height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;cursor:pointer}
#barfill{height:100%;width:0;background:var(--gold)}
#tt{color:#8B7C60;font-size:13px;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.capture #ui{display:none}
</style>
</head>
<body>

<div id="wrap"><div id="root">
	<div id="bg">
		<svg id="lotus" viewBox="0 0 400 400"><g id="lotusg"></g></svg>
		<div id="vign"></div>
	</div>
	<svg id="flags" viewBox="0 0 1920 150" preserveAspectRatio="none"><g id="flagsg"></g></svg>

	<div id="card">
		<div class="edge"></div><div class="edge2"></div>
		<div class="rail l"></div><div class="rail r"></div>
		<svg class="fret t" viewBox="0 0 1404 16" preserveAspectRatio="none"><g id="fretT"></g></svg>
		<svg class="fret b" viewBox="0 0 1404 16" preserveAspectRatio="none"><g id="fretB"></g></svg>
		<div id="yig" class="tib">༄༅།</div>
		<div id="grid"></div>
		<div id="meter"></div>
		<div id="legend"></div>
	</div>

	<div id="panel">
		<div class="scene" id="lex"></div>
		<div class="scene" id="gram"></div>
		<div class="scene" id="trad">
			<div id="wy"></div>
			<div id="lit"></div>
			<div id="ret"></div>
			<div id="sens"></div>
		</div>
	</div>
	<div id="seal" class="tib">༥</div>
	<div id="fade"></div>
</div></div>

<div id="ui">
	<button id="play" type="button" aria-label="Lecture / pause">▶</button>
	<div id="bar" tabindex="0" role="slider" aria-label="Position dans l’animation"
	     aria-valuemin="0" aria-valuemax="32.8" aria-valuenow="0"><div id="barfill"></div></div>
	<div id="tt">0.0 / 32.8</div>
</div>

<script>
/* ============================================================
   ÉPISODE 5 — སྡིག་པ་ཅི་ཡང་མི་བྱ་ཞིང་།
   Tout est piloté par render(t) : un temps unique en secondes.
   ============================================================ */

const CAT = {
	NOMI : {c:'#a97b16', d:'#eac66d', lab:'nominalisateur', tib:'པ་ · བ་'},
	GEN  : {c:'#137a76', d:'#5fcfc7', lab:'génitif',        tib:'གི་'},
	NEG  : {c:'#9b2226', d:'#e78a8a', lab:'négation',       tib:'མི་'},
	TERM : {c:'#2c6b41', d:'#84cf98', lab:'terminative adverbiale', tib:'ར་ · སུ་'},
	CONV : {c:'#b05418', d:'#f2a662', lab:'converb',        tib:'ཞིང་'},
	TOP  : {c:'#6a3ea1', d:'#bda2ec', lab:'particule thématique', tib:'ནི་'},
	COP  : {c:'#1f4e9c', d:'#88aef2', lab:'copule',         tib:'ཡིན་'}
};
const CATORDER = ['NOMI','GEN','NEG','TERM','CONV','TOP','COP'];

/* 4 vers × 7 syllabes. Une cellule = [ [texte, catégorie|null], ... ] */
const ROWS = [
	[ [['སྡིག་',null]], [['པ་','NOMI']], [['ཅི་',null]], [['ཡང་',null]], [['མི་','NEG']], [['བྱ་',null]], [['ཞིང་','CONV']] ],
	[ [['དགེ་',null]], [['བ་','NOMI']],  [['ཕུན་',null]],[['སུམ་',null]],[['ཚོགས་',null]],[['པ','NOMI'],['ར་','TERM']],[['སྤྱད་',null]] ],
	[ [['རང་',null]],  [['གི་','GEN']],  [['སེམས་',null]],[['ནི་','TOP']],[['ཡོངས་',null]],[['སུ་','TERM']],[['འདུལ་',null]] ],
	[ [['འདི་',null]], [['ནི་','TOP']],  [['སངས་',null]],[['རྒྱས་',null]],[['བསྟན་',null]],[['པ་','NOMI']],[['ཡིན་','COP']] ]
];

const LEX = [
	['སྡིག་པ་','sdig pa','nom','le mal, l’acte négatif (skt. <i>pāpa</i>)'],
	['ཅི་','ci','pronom interrogatif','quoi, quel'],
	['ཡང་','yang','particule de généralisation','avec négation : quoi que ce soit → rien'],
	['མི་','mi','négation','ne… pas (devant l’inaccompli)'],
	['བྱ་','bya','verbe, thème du futur','à faire (présent བྱེད་)'],
	['ཞིང་','zhing','converb coordinatif','et, tout en'],
	['དགེ་བ་','dge ba','nom','la vertu, le bien (skt. <i>kuśala</i>)'],
	['ཕུན་སུམ་ཚོགས་པ་','phun sum tshogs pa','locution','l’accomplissement parfait'],
	['ར་','-r','particule terminative','forme l’adverbe : parfaitement'],
	['སྤྱད་','spyad','verbe, thème du passé','pratiquer, s’adonner à (présent སྤྱོད་)'],
	['རང་','rang','pronom réfléchi','soi, son propre'],
	['གི་','gi','particule génitive','de'],
	['སེམས་','sems','nom','l’esprit (skt. <i>citta</i>)'],
	['ནི་','ni','particule thématique','quant à… — isole le thème'],
	['ཡོངས་','yongs','adverbe','en totalité'],
	['སུ་','su','particule terminative','forme l’adverbe : entièrement'],
	['འདུལ་','’dul','verbe','dompter, discipliner'],
	['འདི་','’di','démonstratif','ceci, cela même'],
	['སངས་རྒྱས་','sangs rgyas','nom','le Bouddha (« purifié · épanoui »)'],
	['བསྟན་པ་','bstan pa','nom','l’enseignement (skt. <i>śāsana</i>)'],
	['ཡིན་','yin','copule d’identité','est']
];

const GRAM = [
	['TOP','ནི་, la particule thématique',
	 'Elle ne se traduit pas : elle <i>détache</i> ce qui précède et l’offre comme thème — « quant à… ». Absente des deux premiers vers, elle paraît au troisième et au quatrième : elle marque le pivot du quatrain, là où l’on passe de la conduite à l’esprit, puis à la conclusion. Elle occupe en outre la quatrième syllabe, au cœur du vers.'],
	['CONV','ཅིང་ · ཞིང་ · ཤིང་, le converb',
	 'Une seule fonction, enchaîner deux propositions de même rang ; trois formes commandées par la lettre précédente : <b>ཅིང་</b> après ག ད བ, <b>ཞིང་</b> après ང ན མ ར ལ et après voyelle, <b>ཤིང་</b> après ས. Ici བྱ་ finit par une voyelle → ཞིང་. Même logique d’allomorphes que le génitif (ép. 2) et le ལ་དོན་ (ép. 3).'],
	['TERM','ར་ · སུ་, la terminative adverbiale',
	 'Toujours le ལ་དོན་ de l’épisode 3 — ལ ན ར ཏུ དུ སུ རུ — mais dans un quatrième emploi : non plus situer, <i>former l’adverbe</i>. ཕུན་སུམ་ཚོགས་པ་ + ར་ → « parfaitement » ; ཡོངས་ + སུ་ → « entièrement ». ར་ se soude après voyelle, སུ་ suit le suffixe ས་.'],
	['NOMI','Les thèmes du verbe',
	 'Le verbe tibétain a jusqu’à quatre thèmes : བྱེད་ présent · <b>བྱ་</b> futur · བྱས་ passé · བྱོས་ impératif. L’épisode 4 donnait བྱེད་ ; ici le futur བྱ་, dont la valeur est prescriptive — « ce qui est à faire ». De même སྤྱོད་ → <b>སྤྱད་</b>. Le quatrain énonce une règle, non un récit.']
];

const LIT = [
	'« Ne commettre aucun mal, quel qu’il soit,',
	'et pratiquer parfaitement la vertu ;',
	'quant à son propre esprit, le dompter entièrement — voilà l’enseignement du Bouddha. »'
];
const RET = ['Ne faire aucun mal,','accomplir pleinement le bien,','dompter complètement son esprit :','tel est l’enseignement du Bouddha.'];
const SENS = 'Strophe de l’Instruction commune des bouddhas (Udānavarga · Dhammapada 183) — trois gestes : s’abstenir, accomplir, purifier l’esprit.';

const WY = '<i>sdig pa ci yang mi bya zhing / dge ba phun sum tshogs par spyad /<br>rang gi sems ni yongs su ’dul / ’di ni sangs rgyas bstan pa yin //</i>'
 + '<span class="ph">dik-pa tchi-yang mi-dja shing · gué-wa pün-soum tsok-par tché · rang-gi sèm ni yong-sou doul · di ni sang-gyé tèn-pa yin</span>';

/* ---------------- minutage ---------------- */
const T = {
	card:0.15, flags:0.55, yig:0.95,
	syl0:1.25, sylStep:0.155, lineGap:0.13,
	colnum:6.20, caes:6.62, meter:7.10,
	cat0:8.00, catStep:0.47, legend:8.05,
	compact:12.20,
	lex0:12.80, lexStep:0.185, lexOut:17.40,
	gram0:17.80, gramStep:1.22, gramOut:23.20,
	trad:23.60, wy:23.65, lit0:24.60, litStep:0.92,
	ret0:27.60, retStep:0.50, sens:30.20, seal:31.00,
	fade:31.80, end:32.80
};
const DUR = T.end;

/* ---------------- construction du DOM ---------------- */
const COLS = 7, GW = 1340, CW = GW/ (COLS+0.6);
const colX = i => 8 + i*CW;

/* filigrane : lotus à huit pétales */
(function(){
	const g = document.getElementById('lotusg');
	let s = '';
	for(let k=0;k<8;k++){
		const a = k*45;
		s += `<path d="M200 200 C 152 150, 152 78, 200 38 C 248 78, 248 150, 200 200 Z"
			fill="none" stroke="#d8b25e" stroke-width="1.6" transform="rotate(${a} 200 200)"/>`;
	}
	for(let k=0;k<8;k++){
		const a = k*45+22.5;
		s += `<path d="M200 200 C 168 164, 168 112, 200 84 C 232 112, 232 164, 200 200 Z"
			fill="none" stroke="#d8b25e" stroke-width="1" opacity=".62" transform="rotate(${a} 200 200)"/>`;
	}
	s += '<circle cx="200" cy="200" r="30" fill="none" stroke="#d8b25e" stroke-width="1.4"/>';
	s += '<circle cx="200" cy="200" r="21" fill="none" stroke="#d8b25e" stroke-width=".8" opacity=".7"/>';
	s += '<circle cx="200" cy="200" r="186" fill="none" stroke="#d8b25e" stroke-width=".7" opacity=".45"/>';
	g.innerHTML = s;
})();

/* frise en grecque (bordure de la carte) */
(function(){
	const unit = 36, n = Math.ceil(1404/unit);
	let s='';
	for(let i=0;i<n;i++){
		const x=i*unit;
		s += `<path d="M${x} 15 L${x} 5 L${x+26} 5 L${x+26} 11 L${x+8} 11 L${x+8} 8 L${x+19} 8"
			fill="none" stroke="#9c2b25" stroke-width="1.6"/>`;
	}
	document.getElementById('fretT').innerHTML = s;
	document.getElementById('fretB').innerHTML = s;
})();

/* drapeaux de prière */
const FLAGCOL = ['#2f5fa8','#f3ead6','#b5352c','#2f7a45','#e0a92a'];
(function(){
	let s='';
	for(let i=0;i<20;i++){
		s += `<g class="fl" data-i="${i}"><path d="" fill="${FLAGCOL[i%5]}" opacity=".92"/></g>`;
	}
	s += '<path id="rope" d="" fill="none" stroke="#6d5a3a" stroke-width="2"/>';
	document.getElementById('flagsg').innerHTML = s;
})();

/* grille */
const cells = [], shads = [];
(function(){
	const grid = document.getElementById('grid');
	const head = document.createElement('div'); head.className='gridhead';
	for(let i=0;i<COLS;i++){
		const d=document.createElement('div'); d.className='colnum';
		d.style.left = colX(i)+'px'; d.style.width = CW+'px';
		d.textContent = ['༡','༢','༣','༤','༥','༦','༧'][i];
		d.classList.add('tib');
		head.appendChild(d);
	}
	grid.appendChild(head);

	/* césures après la 2ᵉ et la 4ᵉ syllabe */
	[2,4].forEach((c,k)=>{
		const r=document.createElement('div'); r.className='caes'; r.dataset.k=k;
		r.style.left = (colX(c)-6)+'px';
		grid.appendChild(r);
	});

	ROWS.forEach((row,ri)=>{
		const line=document.createElement('div'); line.className='vline';
		row.forEach((cell,ci)=>{
			const d=document.createElement('div'); d.className='cell tib';
			d.style.left=colX(ci)+'px'; d.style.width=CW+'px';
			cell.forEach(([txt,cat])=>{
				const sp=document.createElement('span'); sp.className='p'; sp.textContent=txt;
				if(cat) sp.dataset.cat=cat;
				d.appendChild(sp);
			});
			line.appendChild(d);
			cells.push(d);
		});
		const sh=document.createElement('div'); sh.className='shad tib';
		sh.style.left=colX(COLS)+'px';
		sh.textContent = ri===3 ? '།།' : '།';
		line.appendChild(sh); shads.push(sh);
		grid.appendChild(line);
	});
})();

/* étiquette de mètre */
(function(){
	const m=document.getElementById('meter');
	m.innerHTML = '<span class="mb">2 · 2 · 3</span>'
		+ '<span class="mt fr"><span class="tib">ཚིག་རྐང་</span> — le vers à sept syllabes, coupé 2 · 2 · 3 ; quatre fois la même mesure</span>';
})();

/* légende */
const chips=[];
(function(){
	const l=document.getElementById('legend');
	CATORDER.forEach(k=>{
		const c=document.createElement('div'); c.className='chip';
		c.style.color = CAT[k].c;
		c.innerHTML = `<b class="tib">${CAT[k].tib}</b> &nbsp;${CAT[k].lab}`;
		l.appendChild(c); chips.push(c);
	});
})();

/* lexique */
const lxs=[];
(function(){
	const L=document.getElementById('lex');
	LEX.forEach(([t,w,n,f])=>{
		const d=document.createElement('div'); d.className='lx';
		d.innerHTML = `<div class="t tib">${t}</div><div><div class="n">${n} · <span class="g">${w}</span></div><div class="f">${f}</div></div>`;
		L.appendChild(d); lxs.push(d);
	});
})();

/* encarts de grammaire */
const gcs=[];
(function(){
	const G=document.getElementById('gram');
	GRAM.forEach(([cat,title,body])=>{
		const d=document.createElement('div'); d.className='gc';
		d.style.borderColor = CAT[cat].d;
		d.innerHTML = `<h3 style="color:${CAT[cat].d}">${title}</h3><p>${body}</p>`;
		G.appendChild(d); gcs.push(d);
	});
})();

/* traductions */
document.getElementById('wy').innerHTML = WY;
document.getElementById('lit').innerHTML = LIT.map(s=>`<span>${s}</span>`).join('');
document.getElementById('ret').innerHTML = RET.map(s=>`<span>${s}</span>`).join('');
document.getElementById('sens').textContent = SENS;

/* Toute suite de caractères tibétains apparaissant dans un texte latin
   reçoit la police tibétaine : sans quoi le repli du navigateur casse
   la ligne de base et la taille. */
function wrapTib(root){
	const TIB=/[ༀ-࿿]+/;
	const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
		acceptNode(n){
			if(!TIB.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
			if(n.parentElement.closest('.tib,.tb')) return NodeFilter.FILTER_REJECT;
			return NodeFilter.FILTER_ACCEPT;
		}});
	const todo=[]; while(w.nextNode()) todo.push(w.currentNode);
	todo.forEach(n=>{
		const frag=document.createDocumentFragment();
		n.nodeValue.split(/([ༀ-࿿]+)/).forEach(part=>{
			if(!part) return;
			if(/[ༀ-࿿]/.test(part)){
				const s=document.createElement('span'); s.className='tb'; s.textContent=part;
				frag.appendChild(s);
			} else frag.appendChild(document.createTextNode(part));
		});
		n.parentNode.replaceChild(frag,n);
	});
}
wrapTib(document.getElementById('root'));

/* ---------------- utilitaires ---------------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=x=>x<=0?0:x>=1?1:1-Math.pow(1-x,3);
function app(el,t,t0,dur,dy){ /* apparition */
	const p=ease((t-t0)/dur);
	el.style.opacity=p;
	if(dy!==undefined) el.style.transform=`translateY(${(1-p)*dy}px)`;
	return p;
}

/* ---------------- rendu ---------------- */
function render(t){
	const R=document.getElementById('root');

	/* fond : lotus qui respire */
	const lo=document.getElementById('lotus');
	lo.style.opacity = 0.085*ease((t-0.2)/2.2);
	lo.style.transform = `rotate(${t*1.5}deg) scale(${1+0.02*Math.sin(t*0.5)})`;

	/* drapeaux ondulants */
	const fg=document.getElementById('flagsg');
	document.getElementById('flags').style.opacity = ease((t-T.flags)/1.0);
	const fls=fg.querySelectorAll('.fl');
	let rope='M-20 34';
	for(let x=-20;x<=1940;x+=20){ rope += ` L${x} ${34+16*Math.sin(x/220+t*0.9)}`; }
	fg.querySelector('#rope').setAttribute('d',rope);
	fls.forEach((g,i)=>{
		const x0=40+i*96, y0=34+16*Math.sin(x0/220+t*0.9);
		const y1=34+16*Math.sin((x0+76)/220+t*0.9);
		const sw=6*Math.sin(t*1.6+i*0.7);
		g.querySelector('path').setAttribute('d',
			`M${x0} ${y0} L${x0+76} ${y1} L${x0+76+sw*0.4} ${y1+72} Q${x0+38} ${y0+86+sw} ${x0-sw*0.4} ${y0+72} Z`);
	});

	/* carte */
	const card=document.getElementById('card');
	const pc=ease((t-T.card)/0.9);
	const k=ease((t-T.compact)/1.15);           /* compactage */
	const sc=(0.96+0.04*pc)*(1-0.365*k);
	const ty=(1-pc)*22 - k*186;
	card.style.opacity=pc;
	card.style.transform=`translateY(${ty}px) scale(${sc})`;
	app(document.getElementById('yig'),t,T.yig,0.7);

	/* syllabes */
	let n=0;
	for(let ri=0;ri<4;ri++){
		for(let ci=0;ci<COLS;ci++){
			const el=cells[n];
			const t0=T.syl0 + n*T.sylStep + ri*T.lineGap;
			const p=ease((t-t0)/0.42);
			el.style.opacity=p;
			el.style.transform=`translateY(${(1-p)*10}px) scale(${0.94+0.06*p})`;
			n++;
		}
		const sp=ease((t-(T.syl0+(ri*COLS+COLS-1)*T.sylStep+ri*T.lineGap+0.18))/0.4);
		shads[ri].style.opacity=sp*0.9;
	}

	/* numéros de colonnes + césures + mètre */
	document.querySelectorAll('.colnum').forEach((d,i)=>app(d,t,T.colnum+i*0.05,0.45,-6));
	document.querySelectorAll('.caes').forEach((r,i)=>{
		const p=ease((t-(T.caes+i*0.18))/0.7);
		r.style.height=(p*460)+'px';
	});
	app(document.getElementById('meter'),t,T.meter,0.7,8);

	/* coloration par catégorie */
	const dark = k<0.5;                       /* sur parchemin ou sur fond nuit */
	CATORDER.forEach((key,i)=>{
		const t0=T.cat0+i*T.catStep;
		const p=ease((t-t0)/0.5);
		document.querySelectorAll(`.p[data-cat="${key}"]`).forEach(sp=>{
			const col = dark?CAT[key].c:CAT[key].d;
			sp.style.color = p>0 ? col : '';
			sp.style.textShadow = p>0.5 ? `0 0 ${10*p}px ${col}44` : 'none';
			sp.style.opacity = 1;
		});
		app(chips[i],t,t0,0.5,6);
	});
	document.getElementById('legend').style.opacity = ease((t-T.legend)/0.5);

	/* --- panneau --- */
	const lexS=document.getElementById('lex'), gramS=document.getElementById('gram'), tradS=document.getElementById('trad');
	lexS.style.opacity  = clamp(ease((t-T.lex0)/0.4) - ease((t-T.lexOut)/0.45),0,1);
	gramS.style.opacity = clamp(ease((t-T.gram0)/0.4) - ease((t-T.gramOut)/0.45),0,1);
	tradS.style.opacity = ease((t-T.trad)/0.5);

	lxs.forEach((d,i)=>app(d,t,T.lex0+i*T.lexStep,0.4,8));
	gcs.forEach((d,i)=>app(d,t,T.gram0+i*T.gramStep,0.6,10));

	app(document.getElementById('wy'),t,T.wy,0.7);
	document.querySelectorAll('#lit span').forEach((s,i)=>app(s,t,T.lit0+i*T.litStep,0.6));
	document.querySelectorAll('#ret span').forEach((s,i)=>app(s,t,T.ret0+i*T.retStep,0.6));
	app(document.getElementById('sens'),t,T.sens,0.7);
	app(document.getElementById('seal'),t,T.seal,0.7);

	document.getElementById('fade').style.opacity = clamp((t-T.fade)/1.0,0,1);

	/* barre de progression */
	const bt = t>DUR?DUR:t;
	document.getElementById('barfill').style.width = (100*bt/DUR).toFixed(2)+'%';
	document.getElementById('tt').textContent = bt.toFixed(1)+' / '+DUR.toFixed(1);
	document.getElementById('bar').setAttribute('aria-valuenow', bt.toFixed(1));
}

/* ---------------- mise à l’échelle + lecture ---------------- */
function fit(){
	const r=document.getElementById('root');
	const s=Math.min(innerWidth/1920, innerHeight/1080);
	r.style.transform=`scale(${s})`;
}
addEventListener('resize',fit); fit();

/* ---------- lecture / pause ---------- */
const cl01 = x => x<0?0:(x>1?1:x);
const playBtn = document.getElementById('play');
const barEl = document.getElementById('bar');
let t = 0, playing = !window.__STILL__, last = null, raf = null;

function paint(){
	render(t);
	playBtn.textContent = playing ? '❚❚' : '▶';
}
function loop(ts){
	if(last===null) last=ts;
	if(playing){
		t += (ts-last)/1000;
		if(t > T.end+1.1) t = 0;   // boucle : reprend à 0 sans s’arrêter
		paint();
	}
	last = ts;
	raf = requestAnimationFrame(loop);
}
playBtn.addEventListener('click', ()=>{ playing=!playing; paint(); });

/* ---------- barre de progression : accroche ---------- */
function seekTo(v){
	t = cl01(v/DUR)*DUR;
	playing = false;
	paint();
}
barEl.addEventListener('click',e=>{
	const r=e.currentTarget.getBoundingClientRect();
	seekTo(cl01((e.clientX-r.left)/r.width)*DUR);
});
barEl.addEventListener('keydown',e=>{
	if(e.key==='ArrowRight'){ seekTo(t+1); e.preventDefault(); }
	else if(e.key==='ArrowLeft'){ seekTo(t-1); e.preventDefault(); }
	else if(e.key==='Home'){ seekTo(0); e.preventDefault(); }
	else if(e.key==='End'){ seekTo(DUR); e.preventDefault(); }
	else if(e.key===' '||e.key==='Enter'){ playing=!playing; paint(); e.preventDefault(); }
});

paint();
if(!window.__STILL__){ raf=requestAnimationFrame(loop); }

window.render=render;
</script>
