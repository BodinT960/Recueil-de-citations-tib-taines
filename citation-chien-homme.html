		T.tabCap, T.tabOut, 6);
})();

/* =========================== fond =========================== */
const BG = document.getElementById('bg'), X = BG.getContext('2d');
function fish(g, cx, cy, s, rot, flip){
	g.save(); g.translate(cx,cy); g.rotate(rot); g.scale(s, s*(flip?-1:1));
	g.beginPath();
	g.moveTo(-1,0); g.quadraticCurveTo(-0.1,-0.42, 1,0);
	g.quadraticCurveTo(-0.1,0.42, -1,0); g.closePath(); g.fill();
	g.beginPath(); g.moveTo(-0.95,0); g.lineTo(-1.55,-0.42);
	g.lineTo(-1.35,0); g.lineTo(-1.55,0.42); g.closePath(); g.fill();
	g.beginPath(); g.arc(0.55,-0.08,0.075,0,7); g.fill();
	g.restore();
}
function drawBG(t){
	const g = X;
	g.fillStyle = '#16100b'; g.fillRect(0,0,1920,1080);
	const rg = g.createRadialGradient(960,430,80, 960,430,1100);
	rg.addColorStop(0,'rgba(84,55,31,.55)'); rg.addColorStop(1,'rgba(22,16,11,0)');
	g.fillStyle = rg; g.fillRect(0,0,1920,1080);
	g.fillStyle = 'rgba(214,167,74,.055)';
	const a = t*0.035;
	fish(g, 960-190, 540, 190, -0.35 + Math.sin(a)*0.05, false);
	fish(g, 960+190, 540, 190,  Math.PI+0.35 - Math.sin(a)*0.05, false);
	const vg = g.createRadialGradient(960,540,520, 960,540,1180);
	vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.72)');
	g.fillStyle = vg; g.fillRect(0,0,1920,1080);
}

/* =========================== rendu =========================== */
const FADE = document.getElementById('fade');
const ease = x => x<0?0 : x>1?1 : (x<0.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2);
const clamp01 = x => x<0?0 : x>1?1 : x;

function render(t){
	drawBG(t);
	/* drapeaux */
	flagEls.forEach((f,i)=>{
		const w = Math.sin(t*1.5 + i*0.62);
		f.style.transform = 'translateY('+(w*5).toFixed(2)+'px) rotate('+(w*2.4).toFixed(2)+'deg)';
	});
	/* carte */
	const cv = clamp01((t-T.card)/0.6);
	CARD.style.opacity = cv;
	const k = 1 - 0.4*ease((t-T.comp)/T.compD);
	const dy = -66*ease((t-T.comp)/T.compD);
	CARD.style.transform = 'translateY('+dy.toFixed(2)+'px) scale('+((0.965+0.035*cv)*k).toFixed(4)+')';
	/* éléments minutés */
	for(const a of A){
		const inn = clamp01((t-a.t0)/0.5);
		const out = 1 - clamp01((t-a.t1)/0.45);
		const o = Math.min(inn, out);
		if(a.el.style) {
			a.el.style.opacity = o;
			if(a.rise) a.el.style.transform = 'translateY('+((1-inn)*a.rise).toFixed(2)+'px)';
		} else a.el.setAttribute('opacity', o);
	}
	/* coloration des catégories */
	CATORDER.forEach((k2,i)=>{
		const on = t >= T.cat0 + i*T.dcat;
		const f = clamp01((t - (T.cat0+i*T.dcat))/0.4);
		morphs.forEach(m=>{
			if(m.cat !== k2) return;
			m.sp.style.color = on ? CAT[k2].c : 'var(--encre)';
			m.pill.style.background = 'rgba(0,0,0,'+(0.045*f).toFixed(3)+')';
		});
	});
	/* fondu final */
	FADE.style.opacity = clamp01((t-T.fade)/(T.end-T.fade));
}

/* lecture temps réel, sauf en mode capture */
window.__render = render;
window.__duration = T.end;
if(!location.search.includes('capture')){
	const t0 = performance.now();
	(function loop(){
		const t = ((performance.now()-t0)/1000) % (T.end+1.5);
		render(t);
		requestAnimationFrame(loop);
	})();
} else {
	render(0);
}
</script>
